# ZL.Gear NuGet 发布（轨道 A · 无混淆）
# 触发: tag push v* / workflow_dispatch
# 共享脚本: qwdingyu/deploy · publish_all.py + pipeline.json
name: Publish to NuGet

"on":
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version（默认对齐 Directory.Build.props 的 1.0.0）'
        required: true
        default: '1.0.0'
      dry-run:
        description: 'Dry run (pack only, no push)'
        type: boolean
        default: false

env:
  DOTNET_NOLOGO: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Public quality gate
        run: bash check_release_public.sh

  build-and-pack:
    needs: quality-gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout deploy repo (shared scripts)
        uses: actions/checkout@v4
        with:
          repository: qwdingyu/deploy
          path: .pipeline
          ref: main

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Build & pack (no obfuscation)
        run: |
          python3 .pipeline/scripts/publish_all.py \
            --version ${{ steps.version.outputs.version }} \
            --skip-obfuscate

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ steps.version.outputs.version }}
          path: artifacts/packages/*.nupkg
          retention-days: 14

  push-to-nuget:
    needs: build-and-pack
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry-run != true)
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages-${{ needs.build-and-pack.outputs.version }}
          path: artifacts/packages

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: dingyuw

      - name: Push to NuGet.org
        run: |
          for pkg in artifacts/packages/*.nupkg; do
            echo "  ➡ $(basename "$pkg")"
            dotnet nuget push "$pkg" \
              --source https://api.nuget.org/v3/index.json \
              --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
              --skip-duplicate
          done
          echo "✅ Published ZL.Gear ${{ needs.build-and-pack.outputs.version }} to NuGet.org"
